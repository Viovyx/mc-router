services:
  router:
      image: itzg/mc-router:latest
      container_name: mc-router
      restart: unless-stopped
      environment:
        API_BINDING: ":80"
        API_KEY: "${API_KEY}"
        ROUTES_CONFIG: "${APP_CONFIG:-config.json)"
      ports:
        - ${APP_PORT:-8080}:80
        - ${APP_MC_PORT:-25565}:25565