services:
  router:
      container_name: mc-router
      build:
        context: .
      restart: unless-stopped
      user: root
      environment:
        - API_BINDING=:80
        - API_KEY=${API_KEY}
        - ROUTES_CONFIG=/etc/router/config.json
        - ALLOWED_ORIGINS=${APP_ALLOWED_ORIGINS}
      volumes:
        - mcrouter-config:/etc/router
      ports:
        - ${APP_PORT:-8080}:80
        - ${APP_MC_PORT:-25565}:25565

volumes:
 mcrouter-config: